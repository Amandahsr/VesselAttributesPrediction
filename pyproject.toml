[project]
name = "vesselattributesprediction"
version = "0.1.0"
description = "A multi-modal model that predicts useful vessel attributes on georeferenced optical satellite imagery."
authors = [
    {name = "Anandadide",email = "amandahsr9@gmail.com"}
]
license = "Resources"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy (>=2.2.6,<3.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "tifffile (>=2025.2.18,<2026.0.0)",
    "keras-cv (>=0.9.0,<0.10.0)",
    "keras-hub (>=0.25.1,<0.26.0)",
    "tensorflow (>=2.20.0,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "iterative-stratification (>=0.1.9,<0.2.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "sahi (>=0.12.1,<0.13.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
